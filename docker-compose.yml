services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: suqafuran-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/suqafuran-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt
      - nginx_logs:/var/log/nginx
      - certbot_data:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - suqafuran-network
    restart: unless-stopped

