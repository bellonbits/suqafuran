  # Redis for caching & Celery
  redis:
    image: redis:7-alpine
    container_name: suqafuran-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Kafka for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: suqafuran-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: suqafuran-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Jaeger v2 for distributed tracing (OpenTelemetry based)
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: suqafuran-jaeger
    environment:
      # Storage configuration
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      # Ports configuration (Jaeger v2 uses environment variables)
      COLLECTOR_GRPC_HOST_PORT: "0.0.0.0:4317"
      COLLECTOR_HTTP_HOST_PORT: "0.0.0.0:4318"
      QUERY_HTTP_SERVER_HOST_PORT: "0.0.0.0:16686"
      ADMIN_HTTP_HOST_PORT: "0.0.0.0:14269"
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "16686:16686"  # Query UI
      - "14269:14269"  # Admin API
    volumes:
      - jaeger_data:/badger
    networks:
      - suqafuran-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suqafuran-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Managed Postgres max_connections=25 total, shared across this
      # container + celery-worker + celery-beat -- backend gets the largest
      # share since it handles concurrent HTTP traffic (see app/db/session.py).
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JAEGER_QUERY_URL: http://jaeger:16686
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGINS: "https://suqafuran.com,https://www.suqafuran.com,https://app.suqafuran.com,https://suqafuran.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://165.22.13.173:3000,capacitor://localhost"
      # OpenTelemetry (OTEL) Configuration for Jaeger v2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: suqafuran-backend
      OTEL_SDK_DISABLED: "false"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suqafuran-celery
    # -Q must list every queue name used in task_routes (celery_app.py) plus
    # the built-in "celery" default -- without -Q, a worker only consumes
    # "celery" itself, so anything task_routes sends to a differently-named
    # queue (default/notifications/promotions) is published to Redis and
    # never picked up. That's exactly what was happening: alert_tasks/
    # subscription_tasks (unrouted, so they land on "celery") were running
    # fine while every email/notification/promotion task sat stuck forever.
    command: celery -A app.tasks.celery_app worker -l info -c 4 -Q celery,default,notifications,promotions
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # -c 4 = up to 4 concurrent task threads, sized accordingly (see backend's
      # DB_POOL_SIZE comment above for the full max_connections budget).
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: suqafuran-celery-worker
      OTEL_SDK_DISABLED: "false"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suqafuran-celery-beat
    command: celery -A app.tasks.celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Scheduler only, never executes tasks itself -- barely touches the DB
      # (see backend's DB_POOL_SIZE comment above for the full budget).
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "1"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: suqafuran-celery-beat
      OTEL_SDK_DISABLED: "false"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - celerybeat_data:/app/celerybeat
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./new-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-AIzaSyAk6rrT_DxxSanx0pwKjLruI-XhgN_zsko}
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY}
    container_name: suqafuran-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - suqafuran-network
    restart: unless-stopped

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: suqafuran-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: suqafuran
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - suqafuran-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  celerybeat_data:
  jaeger_data:
  nginx_logs:
  letsencrypt:
  certbot_data:

networks:
  suqafuran-network:
    driver: bridge
