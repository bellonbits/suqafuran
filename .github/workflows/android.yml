name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shops-app/package-lock.json

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app
        working-directory: shops-app
        run: npm run build

      - name: Capacitor Sync
        working-directory: shops-app
        run: npx cap sync android

      - name: Copy synced web assets into main Android project
        run: |
          rm -rf android/app/src/main/assets/public
          cp -R shops-app/android/app/src/main/assets/public android/app/src/main/assets/public
          cp shops-app/android/app/src/main/assets/capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Release Bundle (.aab)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: suqafuran.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
