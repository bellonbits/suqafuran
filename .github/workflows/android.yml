name: Android Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app
        working-directory: shops-app
        run: npm run build

      - name: Capacitor add Android (if needed)
        run: |
          if [ ! -d "shops-app/android" ]; then
            cd shops-app && npx cap add android
          fi

      - name: Capacitor sync
        working-directory: shops-app
        run: npx cap sync android

      - name: Create keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > shops-app/android/app/suqafuran.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: shops-app/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/suqafuran.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Release Bundle
        working-directory: shops-app/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/suqafuran.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suqafuran.apk
          path: shops-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: suqafuran.aab
          path: shops-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: shops-app/android

      - name: Install Fastlane
        run: gem install fastlane

      - name: Deploy to Play Store Internal Testing
        working-directory: shops-app/android
        run: |
          fastlane supply \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --skip_upload_apk true \
            --json_key <(echo "$PLAY_STORE_API_KEY")
        env:
          PLAY_STORE_API_KEY: ${{ secrets.PLAY_STORE_API_KEY }}
