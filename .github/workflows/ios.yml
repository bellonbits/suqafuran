name: iOS Build & Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15     # Xcode 26 beta is available on macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Use Xcode 26 beta (SDK 26) if available, otherwise latest
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            XCODE=$(ls /Applications/ | grep -i "Xcode_2[6-9]" | sort -r | head -1)
            if [ -n "$XCODE" ]; then
              sudo xcode-select -s "/Applications/$XCODE"
            fi
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app
        working-directory: shops-app
        run: npm run build

      - name: Capacitor add iOS (if needed)
        run: |
          if [ ! -d "shops-app/ios/App" ]; then
            cd shops-app && npx cap add ios
          fi

      - name: Capacitor sync
        working-directory: shops-app
        run: npx cap sync ios

      - name: Install Apple certificates and provisioning profile
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import distribution certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$PROVISIONING_PROFILE" ]; then
            echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Suqafuran.mobileprovision
          fi

      - name: Create output directory
        run: mkdir -p ~/Desktop/SuqafuranIPA

      - name: Build IPA
        working-directory: shops-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            archive -archivePath build/App.xcarchive

          # Create export options plist
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath ~/Desktop/SuqafuranIPA \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/*.ipa
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
