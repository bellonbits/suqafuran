name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shops-app/package-lock.json

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web application
        working-directory: shops-app
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: shops-app
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Ensure Output Directory Exists
        run: mkdir -p ~/Desktop/SuqafuranIPA

      - name: Build IPA and Deploy via Fastlane
        working-directory: shops-app/ios/App
        run: fastlane build
        env:
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran-iOS.ipa
          path: ~/Desktop/SuqafuranIPA/*.ipa
          retention-days: 30