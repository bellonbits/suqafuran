name: iOS Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shops-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app
        working-directory: shops-app
        run: npm run build

      - name: Capacitor Sync
        working-directory: shops-app
        run: npx cap sync

      - name: Copy synced web assets into main iOS project
        run: |
          rm -rf ios/App/App/public
          cp -R shops-app/ios/App/App/public ios/App/App/public
          cp shops-app/ios/App/App/config.xml ios/App/App/config.xml
          cp shops-app/ios/App/App/capacitor.config.json ios/App/App/capacitor.config.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/App/AppStore_com.suqafuran.app.mobileprovision \
          ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        working-directory: ios/App
        run: fastlane build
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/Suqafuran.ipa
          retention-days: 30
