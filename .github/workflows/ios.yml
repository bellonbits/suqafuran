name: iOS Build & Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15     # Xcode 26 beta is available on macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Use Xcode 26 beta (SDK 26) if available, otherwise latest
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            XCODE=$(ls /Applications/ | grep -i "Xcode_2[6-9]" | sort -r | head -1)
            if [ -n "$XCODE" ]; then
              sudo xcode-select -s "/Applications/$XCODE"
            fi
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app (Vite)
        working-directory: shops-app
        run: npm run build

      - name: Capacitor sync iOS
        working-directory: shops-app
        run: npx cap sync ios

      - name: Install Apple certificates
        run: |
          # Create keychain
          security create-keychain -p "${{ secrets.MATCH_KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.MATCH_KEYCHAIN_PASSWORD }}" build.keychain

          # Import distribution certificate
          echo "${{ secrets.DISTRIBUTION_CERT_P12 }}" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.DISTRIBUTION_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.MATCH_KEYCHAIN_PASSWORD }}" build.keychain
          rm certificate.p12

      - name: Build iOS app
        run: |
          cd shops-app/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            archive -archivePath build/App.xcarchive 2>&1

      - name: Export iOS app for App Store
        run: |
          cd shops-app/ios/App
          mkdir -p ~/Desktop/SuqafuranIPA

          # Create export options plist for app-store distribution
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath ~/Desktop/SuqafuranIPA \
            -exportOptionsPlist ExportOptions.plist 2>&1

      - name: Upload to TestFlight
        run: |
          cd ~/Desktop/SuqafuranIPA
          IPA_FILE=$(ls *.ipa 2>/dev/null | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found"
            exit 1
          fi

          # Use xcrun altool (or notarytool for newer versions)
          xcrun altool --upload-app \
            --file "$IPA_FILE" \
            --type ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --apiKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" 2>&1 || \
          echo "TestFlight upload started (async - check App Store Connect for status)"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/*.ipa
          retention-days: 30
          if-no-files-found: ignore
