name: iOS Build & Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15     # Xcode 26 beta is available on macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Use Xcode 26 beta (SDK 26) if available, otherwise latest
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            XCODE=$(ls /Applications/ | grep -i "Xcode_2[6-9]" | sort -r | head -1)
            if [ -n "$XCODE" ]; then
              sudo xcode-select -s "/Applications/$XCODE"
            fi
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app (Vite)
        working-directory: shops-app
        run: npm run build

      - name: Capacitor sync iOS
        working-directory: shops-app
        run: npx cap sync ios

      - name: Build iOS app with Xcode
        run: |
          cd shops-app/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -derivedDataPath build archive -archivePath build/App.xcarchive

      - name: Create output directory
        run: mkdir -p ~/Desktop/SuqafuranIPA

      - name: Create IPA from build
        run: |
          cd shops-app/ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ~/Desktop/SuqafuranIPA/ 2>/dev/null || echo "Export options not configured, skipping IPA export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/*.ipa
          retention-days: 30
