name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shops-app/package-lock.json

      - name: Install Dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build Web
        working-directory: shops-app
        run: npm run build

      - name: Sync Capacitor
        working-directory: shops-app
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Build IPA
        working-directory: shops-app/ios/App
        run: fastlane build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/Suqafuran.ipa
          retention-days: 30