name: iOS Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shops-app/package-lock.json

      - name: Install dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app
        working-directory: shops-app
        run: npm run build

      - name: Capacitor Sync
        working-directory: shops-app
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Install Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain \
            -p github build.keychain

          security default-keychain \
            -s build.keychain

          security unlock-keychain \
            -p github build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k github \
            build.keychain

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$PROFILE_BASE64" | base64 --decode > \
          ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Verify Signing Assets
        run: |
          echo "Certificates:"
          security find-identity -v -p codesigning

          echo ""
          echo "Provisioning Profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build IPA
        working-directory: shops-app/ios/App
        run: fastlane build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suqafuran.ipa
          path: ~/Desktop/SuqafuranIPA/Suqafuran.ipa
          retention-days: 30
