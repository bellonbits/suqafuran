name: iOS Build & Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15     # Xcode 26 beta is available on macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Use Xcode 26 beta (SDK 26) if available, otherwise latest
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            XCODE=$(ls /Applications/ | grep -i "Xcode_2[6-9]" | sort -r | head -1)
            if [ -n "$XCODE" ]; then
              sudo xcode-select -s "/Applications/$XCODE"
            fi
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shops-app dependencies
        working-directory: shops-app
        run: npm ci

      - name: Build web app (Vite)
        working-directory: shops-app
        run: npm run build

      - name: Capacitor sync iOS
        working-directory: shops-app
        run: npx cap sync ios

      - name: Build iOS app for simulator
        run: |
          cd shops-app/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build 2>&1 | tail -50

      - name: Build iOS app for device (requires signing)
        run: |
          cd shops-app/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build 2>&1 | tail -20 || echo "Device build requires code signing - set up in Xcode"
