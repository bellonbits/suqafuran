user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # suqafuran-backend.conf (app.suqafuran.com: API + SSL + WebSocket proxy)
    # is mounted into conf.d but was never actually loaded without this --
    # this file's own http block has no include for it, so port 443 has had
    # no listener behind Docker's port mapping at all.
    include /etc/nginx/conf.d/*.conf;

    # Explicit MIME types for Next.js assets
    types {
        application/javascript js mjs;
        application/wasm wasm;
        application/manifest+json webmanifest;
        text/css css;
        image/svg+xml svg svgz;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;
    gzip_disable "msie6";

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Docker's embedded DNS -- lets nginx re-resolve container hostnames on
    # a short TTL instead of caching them once at startup. A plain
    # `upstream backend { server backend:8000; }` block only resolves once,
    # so every time the backend container gets recreated (any redeploy, not
    # just a crash) it gets a new internal IP and nginx keeps sending
    # traffic to the old one -- "connection refused" 502s -- until nginx
    # itself is restarted. Using this resolver with a variable in
    # proxy_pass (see suqafuran-backend.conf) instead of a static upstream
    # makes that a non-issue.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        server frontend:3000;
    }

    # Frontend Server (HTTP - temporarily until SSL certs are ready)
    # This server (159.223.98.137) hosts ONLY the frontend
    server {
        listen 80 default_server;
        server_name suqafuran.com www.suqafuran.com _;
        charset utf-8;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Let's Encrypt challenge directory (for when certbot retries)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Frontend - everything else
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect off;

            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
