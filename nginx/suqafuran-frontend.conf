# Nginx configuration for Suqafuran frontend on DigitalOcean
# Point suqafuran.com to 165.22.13.173 in Cloudflare DNS
# Then use this config with: sudo cp suqafuran-frontend.conf /etc/nginx/sites-available/
# sudo ln -s /etc/nginx/sites-available/suqafuran-frontend.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    listen [::]:80;
    server_name suqafuran.com www.suqafuran.com;

    # Redirect HTTP to HTTPS (optional, if using SSL)
    # return 301 https://$server_name$request_uri;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to Next.js app running on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

