# Nginx configuration for Suqafuran backend on DigitalOcean (165.22.13.173)
#
# This runs inside the suqafuran-nginx Docker container (mounted into
# conf.d/default.conf, see docker-compose.yml), NOT directly on the host --
# proxy_pass targets must be the Compose service name ("backend"), not
# 127.0.0.1 (that's this container's own loopback, not the host's, so it
# can never reach the sibling backend container that way). And no :8000
# here -- nginx.conf already declares "upstream backend { server
# backend:8000; }", so "backend" resolves to that named upstream group
# rather than a plain DNS hostname; appending a port to a named upstream
# reference is invalid syntax ("upstream may not have port").

# Only send "Connection: upgrade" when the client actually asked for one --
# hardcoding it unconditionally on every proxied request (as this file used
# to) is a real request but the wrong header value for ordinary HTTP calls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.suqafuran.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
# No `http2` here deliberately -- nginx doesn't transparently bridge a
# classic RFC 6455 WebSocket handshake through an HTTP/2-negotiated
# connection (that needs RFC 8441 Extended CONNECT, which this isn't set up
# for), so with http2 on, WS upgrade requests silently degrade to a plain
# HTTP/2 request and the backend 404s since the route is websocket-only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.suqafuran.com;

    ssl_certificate /etc/letsencrypt/live/app.suqafuran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.suqafuran.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket endpoints -- matched before the catch-all below since nginx
    # picks the longest matching prefix for plain (non-regex) locations.
    # These previously fell through to "location /" and its 120s
    # proxy_read_timeout, which silently kills a long-lived chat/notifications
    # connection every two minutes even though the client still thinks it's
    # connected. The old "location /ws/" block that was meant to catch these
    # never actually matched anything -- the real paths are /api/v1/ws/... and
    # /api/v1/notifications/ws, neither of which starts with /ws/.
    location /api/v1/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location /api/v1/notifications/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Proxy to FastAPI backend
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
